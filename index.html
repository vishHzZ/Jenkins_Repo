<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Simple Webpage</title>

    <!-- CSS START -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 30px;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            color: #333;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        footer {
            background-color: #222;
            color: #ccc;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
    <!-- CSS END -->
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Simple webpage using HTML & CSS</p>
    </header>

    <div class="container">
        <h2>About This Page</h2>
        <p>
            This is a simple webpage created using only HTML and CSS.
            Everything is written in a single file.
            You can easily modify colors, text, and layout.
        </p>

        <button>Click Me</button>
    </div>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
